services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeline_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeline_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lifeline_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeline_user} -d ${POSTGRES_DB:-lifeline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifeline_network

  redis:
    image: redis:7-alpine
    container_name: lifeline_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lifeline_redis_pass}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lifeline_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifeline_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lifeline_prod_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifeline_user}:${POSTGRES_PASSWORD:-lifeline_secret_2026}@postgres:5432/${POSTGRES_DB:-lifeline_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-lifeline_redis_pass}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-lifeline_production_access_secret_key_change_in_env_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-lifeline_production_refresh_secret_key_change_in_env_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lifeline_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lifeline_prod_client
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - lifeline_network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  lifeline_network:
    driver: bridge
